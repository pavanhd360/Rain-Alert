name: Rain Alert Automated Run

on:
  schedule:
    # Runs at 02:30 UTC (8:00 AM IST) every day
    - cron: '30 2 * * *'
  workflow_dispatch: # Allows manual testing

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests twilio

      - name: Run script
        env:
          # These MUST match the os.environ.get() names in your code
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          OWN_API_KEY: ${{ secrets.OWN_API_KEY }}
        run: python main.py
